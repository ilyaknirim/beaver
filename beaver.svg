<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 260 150"
     width="260"
     height="150">

  <!-- ЗАДНЯЯ ЛАПА -->
  <rect x="110" y="95" width="14" height="36" rx="6" fill="#5a3a1a">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="-30 117 95"
      to="20 117 95"
      dur="0.32s"
      repeatCount="indefinite"/>
  </rect>

  <!-- ХВОСТ (ПРИКРЕПЛЁН К КОРПУСУ) -->
  <rect x="65" y="78" width="50" height="22" rx="6" fill="#6b4423">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="5 115 90"
      to="-10 115 90"
      dur="0.32s"
      repeatCount="indefinite"/>
  </rect>

  <!-- КОРПУС -->
  <ellipse cx="140" cy="75" rx="52" ry="34" fill="#8b5a2b">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="0 2"
      dur="0.32s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- ПЕРЕДНЯЯ ЛАПА -->
  <rect x="155" y="95" width="14" height="36" rx="6" fill="#5a3a1a">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="20 162 95"
      to="-30 162 95"
      dur="0.32s"
      repeatCount="indefinite"/>
  </rect>

  <!-- ГОЛОВА -->
  <g>
    <ellipse cx="200" cy="65" rx="26" ry="24" fill="#8b5a2b"/>

    <!-- УХО -->
    <ellipse cx="188" cy="42" rx="6" ry="6" fill="#7a4a24"/>

    <!-- ГЛАЗ -->
    <circle cx="205" cy="63" r="3" fill="#000"/>

    <!-- НОС -->
    <circle cx="226" cy="72" r="3" fill="#000"/>

    <!-- ЗУБЫ -->
    <rect x="214" y="76" width="4" height="8" fill="#fff"/>
    <rect x="218" y="76" width="4" height="8" fill="#fff"/>
  </g>

</svg>
