<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 280 160"
     width="280"
     height="160">

  <!-- ЗАДНЯЯ ЛАПА -->
  <rect x="120" y="105" width="16" height="38" rx="7" fill="#5a3a1a">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="-30 128 105"
      to="20 128 105"
      dur="0.32s"
      repeatCount="indefinite"/>
  </rect>

  <!-- БОЛЬШОЙ ХВОСТ -->
  <rect x="40" y="85"
        width="90" height="34"
        rx="12"
        fill="#6b4423">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="6 130 102"
      to="-12 130 102"
      dur="0.45s"
      repeatCount="indefinite"/>
  </rect>

  <!-- КОРПУС -->
  <ellipse cx="160" cy="90" rx="60" ry="38" fill="#8b5a2b">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="0 3"
      dur="0.32s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- ПЕРЕДНЯЯ ЛАПА -->
  <rect x="180" y="105" width="16" height="38" rx="7" fill="#5a3a1a">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="20 188 105"
      to="-30 188 105"
      dur="0.32s"
      repeatCount="indefinite"/>
  </rect>

  <!-- ГОЛОВА -->
  <g>
    <ellipse cx="235" cy="78" rx="28" ry="26" fill="#8b5a2b"/>
    <ellipse cx="220" cy="50" rx="7" ry="7" fill="#7a4a24"/>
    <circle cx="240" cy="75" r="3.5" fill="#000"/>
    <circle cx="264" cy="86" r="3.5" fill="#000"/>
    <rect x="250" y="90" width="5" height="10" fill="#fff"/>
    <rect x="255" y="90" width="5" height="10" fill="#fff"/>
  </g>
</svg>
