<svg width="120" height="280" viewBox="0 0 120 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Стили для водочной бутылки -->
  <style>
    .bottle { fill: transparent; stroke: #333; stroke-width: 2; }
    .glass { fill: #e8f4f8; opacity: 0.9; }
    .label-main { fill: #ffffff; stroke: #c00; stroke-width: 2; }
    .label-red { fill: #c00; }
    .label-gold { fill: #ffd700; }
    .neck { fill: #f0f0f0; }
    .cap { fill: #c00; }
    .cap-top { fill: #ffd700; }
    .liquid { fill: #e8f4f8; opacity: 0.7; }
    .reflection { fill: #ffffff; opacity: 0.3; }
  </style>
  
  <!-- Основная форма бутылки (прямоугольная) -->
  <path class="bottle" d="M 30 40 
                         L 30 230 
                         Q 30 240 40 240 
                         L 80 240 
                         Q 90 240 90 230 
                         L 90 40 
                         Z"/>
  
  <!-- Стекло бутылки -->
  <path class="glass" d="M 32 42 
                        L 32 228 
                        Q 32 238 40 238 
                        L 80 238 
                        Q 88 238 88 228 
                        L 88 42 
                        Z"/>
  
  <!-- Водка внутри -->
  <path class="liquid" d="M 32 150 
                         L 32 228 
                         Q 32 235 40 235 
                         L 80 235 
                         Q 85 235 88 228 
                         L 88 150 
                         Z"/>
  
  <!-- Горлышко -->
  <rect class="neck" x="45" y="20" width="30" height="20" rx="3"/>
  
  <!-- Крышка (красная) -->
  <rect class="cap" x="40" y="5" width="40" height="15" rx="2"/>
  <rect class="cap-top" x="45" y="3" width="30" height="2" rx="1"/>
  
  <!-- Основная этикетка (белая с красным контуром) -->
  <rect class="label-main" x="35" y="80" width="50" height="70" rx="2"/>
  
  <!-- Красная полоса на этикетке -->
  <rect class="label-red" x="35" y="110" width="50" height="15"/>
  
  <!-- Золотая полоса -->
  <rect class="label-gold" x="35" y="130" width="50" height="5"/>
  
  <!-- Текст ВОДКА -->
  <text x="60" y="100" text-anchor="middle" font-family="'Times New Roman', serif" 
        font-size="14" font-weight="bold" fill="#c00">ВОДКА</text>
  
  <!-- Текст 0.5 л -->
  <text x="60" y="145" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" font-weight="bold" fill="#fff">0.5 Л</text>
  
  <!-- Текст 40% -->
  <text x="60" y="165" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="10" fill="#333">40% VOL</text>
  
  <!-- Донная часть -->
  <rect x="35" y="232" width="50" height="6" fill="#ccc" rx="1"/>
  
  <!-- Блики на стекле -->
  <path class="reflection" d="M 40 50 
                             L 40 100 
                             Q 45 95 50 100 
                             L 50 60 
                             Z"/>
  
  <path class="reflection" d="M 75 70 
                             L 75 120 
                             Q 80 115 85 120 
                             L 85 80 
                             Z"/>
  
  <!-- Рельефные линии на бутылке -->
  <line x1="60" y1="40" x2="60" y2="80" stroke="#ccc" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="60" y1="230" x2="60" y2="240" stroke="#ccc" stroke-width="1" stroke-opacity="0.5"/>
  
  <!-- Дополнительный логотип/герб (стилизованный) -->
  <circle cx="60" cy="90" r="8" fill="none" stroke="#c00" stroke-width="1.5"/>
  <text x="60" y="92" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="8" font-weight="bold" fill="#c00">RUS</text>
</svg>